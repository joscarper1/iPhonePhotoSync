name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows está verificado con un iPhone real. Linux y macOS son experimentales: un fallo se ve, pero no bloquea.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, experimental: false }
          - { os: ubuntu-latest, experimental: true }
          - { os: macos-latest, experimental: true }
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0
      - name: Instalar el proyecto
        run: python -m pip install -e ".[dev]"
      - name: ExifTool en Windows (paquete de Chocolatey)
        if: runner.os == 'Windows'
        run: choco install exiftool -y --no-progress
      - name: ExifTool
        run: python tools/fetch_exiftool.py
      - name: Pruebas
        run: python -m pytest -q
