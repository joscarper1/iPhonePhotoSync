name: Release

# Se ejecuta al subir una etiqueta de versión (v0.1.0, v1.2.3…): compila la aplicación para cada sistema operativo y
# adjunta los paquetes a una Release de GitHub, con sumas SHA-256.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # ejecución manual: compila los paquetes y los deja como archivos de la corrida, SIN publicar

permissions:
  contents: write

jobs:
  build:
    name: Compilar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: macos-latest, name: macos-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0
      - name: Instalar el proyecto y PyInstaller
        run: python -m pip install -e ".[dev]"
      - name: ExifTool en Windows (paquete de Chocolatey)
        if: runner.os == 'Windows'
        run: choco install exiftool -y --no-progress
      - name: ExifTool (se incluye en la aplicación)
        run: python tools/fetch_exiftool.py
      - name: Pruebas
        # Linux y macOS son experimentales: se ejecutan y se ven, pero no impiden publicar el paquete
        continue-on-error: ${{ runner.os != 'Windows' }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -n auto
      - name: Empaquetar
        run: python -m PyInstaller --noconfirm --clean packaging/iphonephotosync.spec
      - name: Comprobar el contenido del paquete (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist/iphonephotosync | Select-Object -First 8 Name
          if (-not (Test-Path dist/iphonephotosync/iphonephotosync.exe)) { throw "Falta iphonephotosync.exe" }
          if (-not (Test-Path dist/iphonephotosync/_internal/tools/exiftool/exiftool.exe)) { throw "Falta ExifTool" }
          if (-not (Test-Path dist/iphonephotosync/_internal/iphonephotosync/data/geonames.sqlite)) { throw "Falta la base GeoNames" }
          $out = & dist/iphonephotosync/iphonephotosync.exe --selfcheck | Out-String
          $out; if ($out -notmatch "SELFCHECK OK") { throw "El ejecutable no pasa la autocomprobacion" }
      - name: Comprobar el contenido del paquete (Linux)
        if: runner.os == 'Linux'
        run: |
          ls dist/iphonephotosync | head -8
          test -x dist/iphonephotosync/iphonephotosync
          test -f dist/iphonephotosync/_internal/tools/exiftool/exiftool
          test -f dist/iphonephotosync/_internal/iphonephotosync/data/geonames.sqlite
          dist/iphonephotosync/iphonephotosync --selfcheck | tee /dev/stderr | grep -q "SELFCHECK OK"
      - name: Comprobar el contenido del paquete (macOS)
        if: runner.os == 'macOS'
        run: |
          ls "dist/iPhonePhotoSync.app/Contents/MacOS" | head -8
          test -x "dist/iPhonePhotoSync.app/Contents/MacOS/iphonephotosync"
          "dist/iPhonePhotoSync.app/Contents/MacOS/iphonephotosync" --selfcheck | tee /dev/stderr | grep -q "SELFCHECK OK"
      - name: Comprimir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/iphonephotosync -DestinationPath "iphonephotosync-${{ matrix.name }}.zip"
      - name: Instalador de Windows (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_name }}" -match '^v(\d+\.\d+\.\d+)') { $Matches[1] } else { "0.0.0" }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" packaging/iphonephotosync.iss
          if (-not (Test-Path dist/iphonephotosync-setup.exe)) { throw "No se generó el instalador" }
          Move-Item dist/iphonephotosync-setup.exe "iphonephotosync-setup.exe"
          "{0:N0} MB" -f ((Get-Item iphonephotosync-setup.exe).Length / 1MB)
      - name: Comprimir (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "iphonephotosync-${{ matrix.name }}.tar.gz" -C dist iphonephotosync
      - name: Comprimir (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/iPhonePhotoSync.app" "iphonephotosync-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: iphonephotosync-${{ matrix.name }}
          path: iphonephotosync-*
          if-no-files-found: error

  publish:
    name: Publicar Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')      # solo con una etiqueta de versión; la ejecución manual no publica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - name: Sumas SHA-256
        run: cd paquetes && sha256sum iphonephotosync-* > SHA256SUMS.txt
      - name: Crear la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" paquetes/* --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --generate-notes \
            --notes "Licencia GPL-3.0-or-later. El código fuente exacto de esta versión está en la etiqueta ${{ github.ref_name }} de este repositorio (archivo 'Source code' de esta Release). Windows está verificado con un iPhone real; Linux y macOS son experimentales. Los ejecutables no están firmados: ver el README."
